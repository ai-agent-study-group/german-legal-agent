name: CI

# PR을 올리거나 main에 반영될 때 자동으로 검사를 실행합니다.
# 하나라도 실패하면 PR에 빨간 X가 표시되고, 통과하면 초록 체크가 뜹니다.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: web (lint · type · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint (코드 스타일·문법)
        run: npm run lint
      - name: Typecheck (타입 오류)
        run: npm run typecheck
      - name: Test (동작 검증)
        run: npm test

  scrape:
    name: scrape (python test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/scrape/requirements.txt
      - name: Test (수집 스크립트)
        run: npm run test:scrape
